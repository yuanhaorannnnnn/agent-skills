<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLACEHOLDER_TITLE — Discussion Digest</title>
<style>
  :root {
    --ivory: #FAF9F5; --slate: #141413; --clay: #D97757; --oat: #E3DACC;
    --olive: #788C5D; --rust: #B04A3F; --gray-100: #F0EEE6; --gray-300: #D1CFC5;
    --gray-500: #87867F; --gray-700: #3D3D3A; --white: #FFFFFF;
    --serif: ui-serif, Georgia, serif; --sans: system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
    --radius-panel: 12px; --radius-row: 8px; --border: 1.5px solid var(--gray-300);
  }
  * { box-sizing: border-box; } html { scroll-behavior: smooth; }
  body { margin:0; padding:56px 24px 120px; background:var(--ivory); color:var(--slate); font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .page { max-width:820px; margin:0 auto; }
  header { margin-bottom:32px; }
  .src-id { font-family:var(--mono); font-size:13px; color:var(--gray-500); letter-spacing:0.02em; margin-bottom:8px; }
  h1 { font-family:var(--serif); font-weight:500; font-size:36px; letter-spacing:-0.01em; margin:0 0 18px; line-height:1.2; }
  .meta-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; }
  .pill { display:inline-flex; align-items:baseline; gap:6px; font-size:12px; font-weight:600; border-radius:999px; padding:5px 12px; line-height:1; }
  .pill .k { font-weight:400; opacity:0.75; }
  .pill.op { background:var(--clay); color:var(--white); letter-spacing:0.03em; }
  .pill.stats { background:var(--gray-100); color:var(--gray-700); border:var(--border); }
  .pill.resolved { background:var(--olive); color:var(--white); }
  .tldr { background:var(--slate); color:var(--ivory); border-radius:var(--radius-panel); padding:22px 26px; margin-bottom:48px; }
  .tldr-label { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--oat); margin-bottom:10px; }
  .tldr p { margin:0; font-size:15.5px; line-height:1.65; }
  section { margin-bottom:52px; }
  h2 { font-family:var(--serif); font-weight:500; font-size:24px; letter-spacing:-0.01em; margin:0 0 6px; }
  hr.rule { border:none; border-top:1px solid var(--gray-300); margin:0 0 22px; }
  .card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  .card { background:var(--white); border:var(--border); border-radius:var(--radius-row); padding:18px 20px; }
  .card .card-name { font-family:var(--serif); font-size:17px; font-weight:500; margin-bottom:6px; }
  .card .card-role { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--gray-500); margin-bottom:12px; }
  .card .card-quote { font-size:13px; font-style:italic; color:var(--gray-500); padding-left:12px; border-left:2px solid var(--oat); margin-bottom:14px; line-height:1.55; }
  .card .card-stance { font-size:13px; line-height:1.55; }
  .card .card-stance strong { color:var(--slate); font-size:12px; }
  .timeline { position:relative; padding:4px 0 4px 16px; }
  .timeline::before { content:""; position:absolute; left:16px; top:8px; bottom:8px; width:2px; background:var(--gray-300); }
  .tl-entry { position:relative; padding:0 0 22px 28px; }
  .tl-entry::before { content:""; position:absolute; left:9px; top:7px; width:16px; height:16px; border-radius:50%; background:var(--white); border:2px solid var(--gray-300); }
  .tl-entry.key::before { background:var(--clay); border-color:var(--clay); left:8px; top:6px; width:18px; height:18px; }
  .tl-entry .tl-date { font-family:var(--mono); font-size:12px; color:var(--gray-500); margin-bottom:4px; }
  .tl-entry .tl-body { background:var(--white); border:var(--border); border-radius:var(--radius-row); padding:14px 18px; }
  .tl-entry .tl-author { font-size:13px; font-weight:600; }
  .tl-entry .tl-text { font-size:14px; margin-top:4px; line-height:1.55; }
  .tl-keyword { display:inline-block; font-family:var(--mono); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; background:var(--gray-100); color:var(--clay); padding:2px 7px; border-radius:4px; margin-left:8px; }
  .decision-table { display:grid; grid-template-columns:1fr; gap:10px; }
  .d-entry { background:var(--white); border:var(--border); border-radius:var(--radius-row); padding:16px 20px; display:flex; gap:14px; align-items:flex-start; }
  .d-entry .d-icon { font-size:20px; min-width:28px; text-align:center; }
  .d-entry .d-body { font-size:14px; line-height:1.55; }
  .d-entry .d-body strong { font-size:15px; }
  .open-box { background:var(--gray-100); border-left:3px solid var(--rust); border-radius:0 var(--radius-row) var(--radius-row) 0; padding:18px 22px; margin-top:20px; }
  .open-box h4 { font-family:var(--serif); font-size:15px; font-weight:500; color:var(--rust); margin:0 0 10px; }
  .open-box li { font-size:13px; margin-left:16px; margin-bottom:5px; color:var(--gray-700); }
  footer { margin-top:48px; padding-top:22px; border-top:1px solid var(--gray-300); font-family:var(--mono); font-size:12px; color:var(--gray-500); }
  footer a { color:var(--gray-700); }
</style>
</head>
<body>
<div class="page">
<header>
  <div class="src-id">PLACEHOLDER_SOURCE_ID</div>
  <h1>PLACEHOLDER_TITLE</h1>
  <div class="meta-row">PLACEHOLDER_META_PILLS</div>
</header>
<div class="tldr"><div class="tldr-label">TL;DR</div><p>PLACEHOLDER_TLDR</p></div>
<section>
  <h2>参与方</h2><hr class="rule">
  <div class="card-grid">PLACEHOLDER_PARTICIPANT_CARDS</div>
</section>
<section>
  <h2>讨论时间线</h2><hr class="rule">
  <div class="timeline">PLACEHOLDER_TIMELINE</div>
</section>
<section>
  <h2>结论与决议</h2><hr class="rule">
  <div class="decision-table">PLACEHOLDER_DECISIONS</div>
  <div class="open-box"><h4>未解决的问题</h4>PLACEHOLDER_UNRESOLVED</div>
</section>
<footer>来源：<a href="PLACEHOLDER_SOURCE_URL">PLACEHOLDER_SOURCE_URL</a> · 梳理时间：PLACEHOLDER_DATE · 用 discussion-digest 生成</footer>
</div>
</body>
</html>
